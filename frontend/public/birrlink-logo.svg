<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Luxury Background Gradient -->
    <linearGradient id="blBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e39" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Radiant European Gold / Euro Arc Gradient -->
    <linearGradient id="blGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Ethiopian Emerald / Birr Arc Gradient -->
    <linearGradient id="blEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- High-Speed Lightning Glow Filter -->
    <filter id="blGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Radial Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#blBase)" stroke="#10b981" stroke-width="2" stroke-opacity="0.45" />

  <!-- Top Glass Highlight Rim -->
  <path d="M 22 32 C 22 20 30 12 48 10 L 72 10 C 90 12 98 20 98 32" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- LEFT CORRIDOR LOOP: Europe / Euro Rail (€) in Warm Gold -->
  <path d="M 52 30 C 35 30 26 41 26 60 C 26 79 35 90 52 90 C 60 90 65 86 70 80" stroke="url(#blGold)" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- RIGHT CORRIDOR DUAL-LOOP: Ethiopian Birr Rail (Forming 'B') in Emerald Mint -->
  <!-- Top lobe -->
  <path d="M 52 30 H 68 C 80 30 89 37 89 48 C 89 57 81 62 70 62 H 54" stroke="url(#blEmerald)" stroke-width="11" stroke-linecap="round" fill="none" />
  <!-- Bottom lobe -->
  <path d="M 54 62 H 72 C 84 62 93 69 93 80 C 93 90 84 90 70 90 H 52" stroke="url(#blEmerald)" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- Central Interlocking Spine Anchor in Pure Crisp White -->
  <path d="M 52 30 L 52 90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95" />

  <!-- Central Speed Settlement Lightning Bolt ⚡ -->
  <path d="M 62 23 L 44 58 L 58 58 L 51 93 L 80 51 L 63 51 Z" fill="#fef08a" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" filter="url(#blGlow)" />

  <!-- Micro Currency Flow Nodes -->
  <circle cx="34" cy="60" r="3.5" fill="#fde047" opacity="0.9" />
  <circle cx="84" cy="48" r="3" fill="#a7f3d0" opacity="0.9" />
  <circle cx="88" cy="80" r="3" fill="#a7f3d0" opacity="0.9" />
</svg>
